name: Forterausa

description: Forterausa, now operating as Fortera Global, develops low‑carbon cement technologies that reduce CO₂ emissions in construction. The
  company offers the ReAct product line and ReCarb plants, providing data, documentation, and carbon credit solutions to accelerate sustainable
  building practices worldwide. Backed by Khosla Ventures and other investors, Fortera aims to scale economical, low‑CO₂ cement production for
  global infrastructure projects.

